  <!-- Contacto -->
  <section id="contacto" class="seccion-clara py-5">

    <div class="container">

      <h2
        class="seccion-titulo texto-negro text-center"
        data-i18n="contactForm.heading">

        Formulario de Contacto

      </h2>

      <p class="seccion-descripcion text-center">

        ¿Querés contactarme por una oportunidad laboral,
        proyecto o colaboración?

      </p>

      <div class="row justify-content-center mt-4">

        <div class="col-12 col-md-8 col-lg-6">

          <!-- ALERT SUCCESS -->
          <div
            id="alertSuccess"
            class="alert alert-success alert-dismissible fade d-none"
            role="alert">

            <span data-i18n="contactForm.success">

              ¡Tu mensaje fue enviado correctamente!

            </span>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Cerrar">

            </button>

          </div>

          <!-- FORM -->
          <form id="contactForm" novalidate>

            <!-- Nombre -->
            <div class="mb-3">

              <label
                for="name"
                class="form-label"
                data-i18n="contactForm.name">

                Nombre

              </label>

              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Tu nombre"
                data-i18n-placeholder="contactForm.namePh"
                required>

              <div
                class="invalid-feedback"
                data-i18n="contactForm.nameError">

                Por favor ingresa tu nombre.

              </div>

            </div>

            <!-- Email -->
            <div class="mb-3">

              <label
                for="email"
                class="form-label"
                data-i18n="contactForm.email">

                Email

              </label>

              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="tu@email.com"
                data-i18n-placeholder="contactForm.emailPh"
                required>

              <div
                class="invalid-feedback"
                data-i18n="contactForm.emailError">

                Por favor ingresa un email válido.

              </div>

            </div>

            <!-- Mensaje -->
            <div class="mb-3">

              <label
                for="message"
                class="form-label"
                data-i18n="contactForm.message">

                Nota

              </label>

              <textarea
                class="form-control"
                id="message"
                name="message"
                rows="5"
                placeholder="Escribe tu mensaje..."
                data-i18n-placeholder="contactForm.messagePh"
                required></textarea>

              <div
                class="invalid-feedback"
                data-i18n="contactForm.messageError">

                Por favor ingresa un mensaje.

              </div>

            </div>

            <!-- Botón -->
            <button
              type="submit"
              class="btn btn-primary"
              data-i18n="contactForm.send">

              Enviar

            </button>

          </form>

        </div>

      </div>

    </div>

  </section>
